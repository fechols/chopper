[package]
name = "chopper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Super Huey tribute: free-flight flat-shaded helicopter sim for the 64 MHz C64 Ultimate + 16 MiB REU"

[lib]
name = "chopper"
path = "src/lib.rs"

[[bin]]
name = "chopper"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
host = []

[dependencies]

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("mos"))'] }
